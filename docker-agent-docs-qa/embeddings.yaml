agents:
  root:
    model: openai/gpt-5-mini
    description: Answers questions about Polars from the user guide
    instruction: |
      You answer questions about the Polars DataFrame library.
      Always search the knowledge base before answering.
      Answer only from what the search returns.
      End with a "Sources:" list of the file paths you used, relative to docs/polars.
    toolsets:
      - type: rag
        ref: polars_docs
  reviewer:
    model: openai/gpt-5
    description: Reviews Polars code against the user guide
    instruction: |
      You review Polars code.
      Search the docs for each function the code uses.
      Point out slower or outdated patterns and suggest the fix the docs recommend.
      End with a "Sources:" list of the file paths you used, relative to docs/polars.
    toolsets:
      - type: rag
        ref: polars_docs

rag:
  polars_docs:
    tool:
      description: The Polars user guide
    docs: [./docs/polars]
    strategies:
      - type: chunked-embeddings
        embedding_model: openai/text-embedding-3-small
        vector_dimensions: 1536

flavors:
  hybrid:
    rag:
      polars_docs:
        strategies+:
          - type: bm25
        results:
          fusion:
            strategy: rrf
            k: 60
          deduplicate: true
          limit: 5
  cheap:
    agents:
      root:
        model: openai/gpt-5-nano
